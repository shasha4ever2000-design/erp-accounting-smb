# Temporary helper on the trading-bot side branch only.
# Downloads daily price history (free public sources) and saves it
# into trading-bot/data/history/ so the strategy can be tested on past prices.
name: Trading bot - fetch price history

on:
  workflow_dispatch:
  push:
    branches: [claude/nifty-tesla-1qoxtc]
    paths:
      - "trading-bot/tools/fetch_history.py"
      - ".github/workflows/trading-bot-fetch-history.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download history
        working-directory: trading-bot
        run: python tools/fetch_history.py --out data/history --start 2014-01-01 || echo "some symbols failed"
      - name: Save to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trading-bot/data/history
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "Trading bot: price history data"
            git push
          fi
