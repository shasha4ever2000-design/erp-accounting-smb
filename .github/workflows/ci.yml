name: CI

# Run the accounting-engine test suite (and a production build) on every push
# and pull request. gh-pages is excluded — it holds only built assets, with no
# package.json to install or test.
on:
  push:
    branches-ignore: ['gh-pages']
  pull_request:

# A newer push to the same branch/PR cancels an in-progress run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      # The Supabase Edge Function is Deno TypeScript; nothing else compiles it.
      - name: Type-check server functions
        run: npx -y deno@2 check supabase/functions/ai-chat/index.ts

      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and run end-to-end tests
        run: npm run e2e

      - name: Keep traces of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
