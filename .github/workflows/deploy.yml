name: Deploy to GitHub Pages

# Publish the site whenever main moves.
#
# This exists because the alternative had already bitten: a day's work sat
# finished and invisible because merging and publishing were separate manual
# acts, and only one of them had happened. A fix you cannot ship is not a fix.
#
# Pages serves the gh-pages branch, so that is what this writes to — the
# repository's Pages setting is left alone rather than migrated to the Actions
# source, which would need a settings change nobody would remember making.
on:
  push:
    branches: [main]
  # ...and by hand, for re-publishing without an empty commit.
  workflow_dispatch:

# Never let two deploys race for the same branch: the loser force-pushes stale
# assets over the winner. Queue them instead of cancelling, so the last commit
# on main is always the one that ends up live.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: Build & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A broken build must never reach the live site. CI runs these on the
      # pull request too; repeating them here costs seconds and means a direct
      # push to main cannot skip them.
      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build

      # The SPA fallback is what makes a refresh on /purchases/<id> load the
      # app instead of Pages' own 404. If it is missing the deploy is wrong in
      # a way nobody would notice until they refreshed a document.
      - name: Verify the build looks publishable
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/404.html   || { echo "::error::dist/404.html missing — SPA deep links would 404"; exit 1; }
          test -d dist/assets     || { echo "::error::dist/assets missing"; exit 1; }

      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          SHA_SHORT="$(git rev-parse --short HEAD)"
          SUBJECT="$(git log -1 --pretty=%s)"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep the branch's history rather than force-pushing an orphan each
          # time, so a bad deploy can be read and reverted like anything else.
          #
          # actions/checkout fetches with a refspec narrowed to the pushed
          # branch, so origin/gh-pages does not exist here and `worktree add
          # gh-pages` would fail on an invalid reference. Name the refspec
          # explicitly, then point a local branch at what came back.
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
            git worktree add -B gh-pages ../pages origin/gh-pages
          else
            git worktree add --detach ../pages
            git -C ../pages checkout --orphan gh-pages
          fi

          # Replace the contents wholesale: a file deleted from the build must
          # disappear from the site, not linger because nothing overwrote it.
          find ../pages -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R dist/. ../pages/

          cd ../pages
          git add -A
          if git diff --cached --quiet; then
            echo "Site is already up to date — nothing to publish."
            exit 0
          fi
          git commit -q -m "Deploy ${SHA_SHORT}: ${SUBJECT}"
          git push origin gh-pages
          echo "Published ${SHA_SHORT} to gh-pages."

      - name: Where it went
        run: |
          echo "### Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"
